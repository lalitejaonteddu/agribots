[platformio]
default_envs = nucleo_f411re

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
build_flags =
    -DSTM32F411xE
    -DUSE_HAL_DRIVER
    -O2
    -Wall

[env:native]
platform = native
build_flags =
    -std=c99
    -Wall
    -Iinclude
test_filter = test_protocol
